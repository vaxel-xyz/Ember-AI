# Pre-commit hooks for secret scanning + shell hygiene.
# Install: pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: detect-private-key
      - id: check-added-large-files
        args: ['--maxkb=500']

  # Shellcheck on `bin/ember` + the bash test harness. `--severity=error`
  # is the bar CI gates on, so existing style-level warnings do not tip the
  # pre-commit run while genuine errors are caught locally before push.
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        name: shellcheck (bin/ember + tests, errors only)
        files: ^(bin/ember|tests/.*\.sh)$
        args: ['--exclude=SC1091,SC2034', '--severity=error']

      # Catch legacy `…` command substitution anywhere in the shell
      # surface. SC2006 is style-level so it's filtered out by the
      # severity=error pass above; an explicit --include re-enables it
      # without dragging the rest of style-level noise back in. The tree
      # is currently zero-SC2006, so this hook starts as a regression guard.
      - id: shellcheck
        name: shellcheck SC2006 (no legacy backticks)
        files: ^(bin/ember|tests/.*\.sh)$
        args: ['--include=SC2006']
