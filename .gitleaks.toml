# Custom rules below are additive: without [extend] a config passed via
# --config REPLACES the built-in ruleset (default rules do not apply).
# useDefault=true keeps the full default detector set (aws-access-token,
# private keys, generic-api-key, etc.) active alongside these two.
[extend]
  useDefault = true

[[rules]]
  id = "langfuse-project-public-key"
  description = "Langfuse project public key"
  regex = '''pk-lf-[0-9a-f]+\b'''
  keywords = ["pk-lf-"]

[[rules]]
  id = "langfuse-project-secret-key"
  description = "Langfuse project secret key"
  regex = '''sk-lf-[0-9a-f]+\b'''
  keywords = ["sk-lf-"]

[[allowlists]]
  description = "Placeholder templates only"
  paths = [ '''\.env\.example$''' ]

# Enabling [extend] above surfaces 54 pre-existing findings in git history
# inherited from the pre-lean-rebuild codebase (deleted paths under
# archive/, dream-server/, ods/, resources/ — none exist at HEAD; see
# `git log --diff-filter=D` for their removal). Verified each by hand:
# jwt.io canonical example tokens, doc placeholders (YOUR_TOKEN,
# your-api-key), test/cookbook fixture values (sk-abc123xyz789abcdef,
# fictional-secret-098765, test-ape-key-12345), a searxng template
# default, and a demo LiveKit key/secret pair already called out by a
# prior audit (SECURITY_AUDIT.md, same commit era) in an archived
# cookbook. No live credential among them. Allowlisted by exact
# (now-dead) path rather than by pattern or directory glob, so this
# does not weaken detection on any file present in the current tree.
[[allowlists]]
  description = "Dead history from pre-rebuild codebase (deleted, verified false-positive)"
  paths = [
  '''^SECURITY_AUDIT\.md$''',
  '''^archive/cookbook/android-labs/cookbooks/agent-template-writing\.md$''',
  '''^archive/cookbook/android-labs/docs/LIVEKIT-DEPLOYMENT-GUIDE\.md$''',
  '''^archive/cookbook/android-labs/products/privacy-shield/test_shield\.py$''',
  '''^archive/cookbook/voice-agent-framework/core/hvac-token-server\.py$''',
  '''^dream-server/config/searxng/settings\.yml$''',
  '''^dream-server/extensions/services/ape/tests/conftest\.py$''',
  '''^dream-server/extensions/services/dreamforge/rust/crates/runtime/src/secret_scanner\.rs$''',
  '''^dream-server/extensions/services/litellm/README\.md$''',
  '''^dream-server/extensions/services/privacy-shield/tests/test_pii_scrubber\.py$''',
  '''^dream-server/installers/macos/lib/env-generator\.sh$''',
  '''^dream-server/installers/windows/lib/env-generator\.ps1$''',
  '''^dream-server/privacy-shield-offline/pii_scrubber\.py$''',
  '''^dream-server/privacy-shield/pii_scrubber\.py$''',
  '''^ods/extensions/services/dashboard-api/extension_planning_contract\.py$''',
  '''^ods/extensions/services/dashboard-api/routers/extension_planning\.py$''',
  '''^ods/extensions/services/dashboard-api/tests/test_plan_provenance\.py$''',
  '''^ods/extensions/services/dashboard/src/components/PixelCommandSearch\.test\.jsx$''',
  '''^ods/extensions/services/dashboard/src/lib/pixelConversations\.js$''',
  '''^ods/extensions/services/dashboard/src/lib/pixelConversations\.test\.js$''',
  '''^ods/extensions/services/dashboard/src/lib/pixelSavedPrompts\.js$''',
  '''^ods/extensions/services/model-router/tests/test_router\.py$''',
  '''^ods/tests/pixel_inference/test_advice_process\.py$''',
  '''^ods/tests/test-perplexica-entrypoint\.py$''',
  '''^resources/dev/extensions-library/services/gitea/README\.md$''',
  '''^resources/dev/extensions-library/services/privacy_shield/pii_scrubber\.py$''',
  '''^resources/dev/extensions-library/workflows/comfyui/README\.md$''',
  '''^resources/dev/extensions-library/workflows/flowise/README\.md$''',
  '''^resources/dev/extensions-library/workflows/langflow/README\.md$''',
  ]
